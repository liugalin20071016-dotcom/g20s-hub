# 每次推送 / PR 都编译并打包；推送 v* 标签时自动发布 Release（附安装包和免安装 zip）
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        shell: pwsh
        run: ./package.ps1 -Url "${{ github.server_url }}/${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: G20SHub
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "G20S Hub ${{ github.ref_name }}" --notes-file CHANGELOG.md
